# Plantilla educativa para Debian 13. Revisar IP, rutas, socket y certificados.
# Instalar en sites-available y validar con nginx -t ANTES de recargar.
server {
    listen 192.168.56.10:80;
    server_name wp.aula.test;
    return 301 https://wp.aula.test$request_uri;
}

server {
    listen 192.168.56.10:443 ssl;
    server_name wp.aula.test;
    root /srv/www/wp-aula;
    index index.php index.html;

    ssl_certificate /etc/ssl/certs/wp-aula.crt;
    ssl_certificate_key /etc/ssl/private/wp-aula.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 16m;

    access_log /var/log/nginx/wp-aula.access.log;
    error_log /var/log/nginx/wp-aula.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /wp-config.php { deny all; }
    location ~ /\. { deny all; }

    # Evitar ejecución de PHP subido. Debe aparecer antes del handler PHP.
    location ~* ^/wp-content/uploads/.*\.php(?:/|$) { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
}
